[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitfault"
version = "0.2.0"
description = "Find the fault lines in any codebase — hotspots, change-coupling and knowledge risk, straight from your git history."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Kenji Rasmussen" }]
keywords = ["git", "code-analysis", "hotspots", "technical-debt", "coupling",
            "bus-factor", "cli", "code-quality", "refactoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["rich>=13.0"]

[project.urls]
Homepage = "https://github.com/PLACEHOLDER/gitfault"
Issues = "https://github.com/PLACEHOLDER/gitfault/issues"

[project.scripts]
gitfault = "gitfault.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gitfault"]
